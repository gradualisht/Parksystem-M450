; Parkhaus mit Schranke (M450) - zwei Raspberry Pi Pico W, Arduino-Framework
;
;   pio run -e kasse    -t upload   Kassen-Pico (WLAN-Zugangspunkt, Weboberflaeche, Datenhaltung)
;   pio run -e schranke -t upload   Schranken-Pico (zwei SG90, simulierte Kennzeichenerkennung)
;   pio test -e native              Unit-Tests der Logik ohne Board (Unity)

[platformio]
default_envs = kasse, schranke

[pico_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

[env:kasse]
extends = pico_base
build_src_filter = -<*> +<kasse/>

[env:schranke]
extends = pico_base
build_src_filter = -<*> +<schranke/>

; Native env: Parkplatz-Logik (Gebuehr, Zahlstatus, Fristen) ohne Board testen
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
